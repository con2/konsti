name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-24.04

    env:
      CI: true
      HUSKY: 0

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set actionlint Problem Matchers
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
        shell: bash

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "yarn"

      - name: Yarn install
        run: |
          YARN_ENABLE_HARDENED_MODE=1 yarn --immutable

      - name: Restore lint caches
        uses: actions/cache@v6
        with:
          path: |
            client/.eslintcache
            server/.eslintcache
            client/.stylelintcache
            node_modules/.cache/prettier
            node_modules/.cache/knip
          key: lint-${{ runner.os }}-${{ hashFiles('eslint.config.ts', 'yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('eslint.config.ts', 'yarn.lock') }}-

      - name: Run Prettier
        run: |
          yarn prettier:check

      - name: Run ESLint
        run: |
          yarn eslint

      - name: Run Knip
        run: |
          yarn knip

      - name: Run stylelint
        run: |
          yarn stylelint

      - name: Find unused translation keys
        run: |
          yarn find-unused-translation-keys

  type-check:
    runs-on: ubuntu-24.04

    env:
      CI: true
      HUSKY: 0

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "yarn"

      - name: Yarn install
        run: |
          YARN_ENABLE_HARDENED_MODE=1 yarn --immutable

      - name: Restore TypeScript build info cache
        uses: actions/cache@v6
        with:
          path: |
            client/node_modules/.cache/tsbuildinfo
            server/node_modules/.cache/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'client/tsconfig.json', 'server/tsconfig.json', 'yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'client/tsconfig.json', 'server/tsconfig.json', 'yarn.lock') }}-

      - name: TS type check
        run: |
          yarn type-check

  build-and-test:
    runs-on: ubuntu-24.04

    env:
      CI: true
      HUSKY: 0

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "yarn"

      - name: Yarn install
        run: |
          YARN_ENABLE_HARDENED_MODE=1 yarn --immutable

      - name: Build front-end
        run: |
          yarn build-front:prod

      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-8.0.29

      - name: Run Vitest tests
        run: |
          yarn test

  e2e:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    env:
      CI: true
      HUSKY: 0

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "yarn"

      - name: Yarn install
        run: |
          YARN_ENABLE_HARDENED_MODE=1 yarn --immutable

      # Keyed by the Playwright version rather than yarn.lock, so an unrelated
      # dependency bump doesn't throw the browsers away
      - name: Read Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Only the browsers the enabled projects use; extend the list when an
      # ENABLE_* flag in the Playwright config is flipped
      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium webkit

      # Each shard runs its own server + Mongo on the runner, so the shared-DB
      # serial constraint holds within a shard while the suite parallelizes across runners
      - name: Run Playwright tests
        run: |
          yarn e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload test results if Playwright tests failed
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-videos-${{ matrix.shard }}
          path: playwright/test-results/

  # The e2e job no longer builds the image, so a PR still has to prove the
  # Dockerfile builds. Main pushes build it in the Deploy workflow anyway
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build --build-arg env=prod .

  merge-reports:
    # Merge the per-shard blob reports into one HTML report. Runs even if a shard failed,
    # so a failing run still produces a browsable report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04

    env:
      CI: true
      HUSKY: 0

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # Runs the pinned Playwright straight from the registry: a full yarn install
      # would cost more than this whole job
      - name: Merge into HTML report
        run: |
          npx --yes "@playwright/test@$(node -p "require('./package.json').devDependencies['@playwright/test']")" merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 7

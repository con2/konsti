name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set actionlint problem matchers
        run: echo "::add-matcher::.github/actionlint-matcher.json"

      - name: Run actionlint
        # Built 2026-03-30 on Alpine 3.23.3
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Install Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Restore lint caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/.eslintcache
            server/.eslintcache
            client/.stylelintcache
            node_modules/.cache/prettier
            node_modules/.cache/knip
          key: lint-${{ runner.os }}-${{ hashFiles('eslint.config.ts', 'yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('eslint.config.ts', 'yarn.lock') }}-

      - name: Run Prettier
        run: yarn prettier:check

      - name: Run ESLint
        run: yarn eslint

      - name: Run Knip
        run: yarn knip

      - name: Run stylelint
        run: yarn stylelint

      - name: Find unused translation keys
        run: yarn find-unused-translation-keys

  type-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Restore TypeScript build info cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/node_modules/.cache/tsbuildinfo
            server/node_modules/.cache/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'client/tsconfig.json', 'server/tsconfig.json', 'yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'client/tsconfig.json', 'server/tsconfig.json', 'yarn.lock') }}-

      - name: TS type check
        run: yarn type-check

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Build front-end
        run: yarn build-front:prod

      - name: Cache MongoDB binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ hashFiles('server/src/test/mongoDbVersion.ts') }}

      - name: Run Vitest tests
        run: yarn test

      # The e2e job runs the app on the runner, so a PR still has to prove the
      # image builds and its server starts with only production dependencies.
      # A push to main builds it again before deploying.
      - name: Start the Docker image
        if: github.event_name == 'pull_request'
        run: APP_SETTINGS=ci docker compose -f docker/docker-compose.yml up --build --detach

      - name: Wait for the image to serve the app
        if: github.event_name == 'pull_request'
        run: timeout 60 bash -c 'until curl -sf http://localhost:5000/api/health > /dev/null && curl -sf http://localhost:5000/ > /dev/null; do sleep 1; done'

      - name: Show the image's server log
        if: failure() && github.event_name == 'pull_request'
        run: docker compose -f docker/docker-compose.yml logs server

  e2e:
    # Each shard runs its own server + Mongo on the runner, so the shared-DB
    # serial constraint holds within a shard while the suite parallelizes across runners
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and dependencies
        uses: ./.github/actions/setup

      # Keyed by the Playwright version rather than yarn.lock, so an unrelated
      # dependency bump doesn't throw the browsers away
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Only the browsers the enabled projects use; extend the list when an
      # ENABLE_* flag in the Playwright config is flipped
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: yarn e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload test results if Playwright tests failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-videos-${{ matrix.shard }}
          path: playwright/test-results/

  coverage-smoke:
    # The coverage pipeline itself runs on main only (coverage.yml), so this
    # takes one spec through all of it: the instrumented builds, the server
    # coverage flush, the c8 conversion and the report merge break on tooling
    # and runtime changes the suite cannot see
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and dependencies
        uses: ./.github/actions/setup

      # Keyed by the Playwright version rather than yarn.lock, so an unrelated
      # dependency bump doesn't throw the browsers away
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Only the browsers the enabled projects use; extend the list when an
      # ENABLE_* flag in the Playwright config is flipped
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run one spec through the coverage pipeline
        run: yarn coverage:e2e logout

      - name: Build combined coverage report
        run: yarn coverage:report

  merge-reports:
    # Merge the per-shard blob reports into one HTML report. Runs even if a shard failed,
    # so a failing run still produces a browsable report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 7

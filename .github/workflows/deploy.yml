name: Deploy
run-name: deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options:
          - staging
          - prod
        default: prod

# One deploy per environment at a time, never cancelled mid-rollout. A queued
# run is superseded by a newer one of the same ref, which is fine since the
# newest run has the newest commit.
concurrency:
  group: deploy-${{ github.ref }}-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  cancel-in-progress: false

env:
  SKAFFOLD_DEFAULT_REPO: ghcr.io/con2
  # Push to main auto-deploys staging, workflow_dispatch uses selected environment
  DEPLOY_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

jobs:
  build:
    # workflow_dispatch can be started from any branch, only main is deployable.
    # The jobs that need this one are skipped with it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
      # Deploy time rather than commit time: a rollback ships an older commit
      # but is still the newest deployment, and clients have to pick it up.
      # In the tag too, so no tag is ever overwritten and old deploys stay pullable.
      - name: Name the image
        id: image
        run: |
          build_time=$(date -u +%s)
          echo "build-time=$build_time" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/con2/konsti:$GITHUB_SHA-$DEPLOY_ENV-$build_time" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            env=${{ env.DEPLOY_ENV }}
            APP_VERSION=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.image.outputs.build-time }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    needs: build
    runs-on: qb-arc-runners
    timeout-minutes: 30
    env:
      SKAFFOLD_VERSION: v2.24.0
      KUBECTL_VERSION: v1.36.2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Cache skaffold and kubectl
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-skaffold-${{ env.SKAFFOLD_VERSION }}-kubectl-${{ env.KUBECTL_VERSION }}
      - name: Download skaffold and kubectl
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -fsSLo bin/skaffold "https://storage.googleapis.com/skaffold/releases/$SKAFFOLD_VERSION/skaffold-linux-amd64"
          curl -fsSLo bin/kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          chmod +x bin/skaffold bin/kubectl
      - name: Add skaffold and kubectl to PATH
        run: echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Disable skaffold telemetry
        run: skaffold config set --global collect-metrics false
      - name: Deploy with skaffold
        env:
          SKAFFOLD_ENV: ${{ env.DEPLOY_ENV == 'prod' && 'production' || env.DEPLOY_ENV }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          : "${DIGEST:?build job produced no image digest}"
          python3 -m pip install setuptools emskaffolden
          # Pinned by digest so the cluster pulls exactly the image this run built.
          # Roll back with a new run rather than re-running an old one, which would
          # redeploy its old build time and clients would never pick it up.
          emskaffolden -E "$SKAFFOLD_ENV" \
            -- deploy -n "konsti-$SKAFFOLD_ENV" \
            --images "konsti=$IMAGE@$DIGEST"

  # Frontend source maps are injected with debug IDs and uploaded by the Sentry
  # Vite plugin during the Docker image build, so the deployed bundle matches
  # the uploaded maps. This job only marks the backend release for deploy tracking.
  backend-sentry-release:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create backend Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: konsti
          SENTRY_PROJECT: konsti-backend-${{ env.DEPLOY_ENV }}
        with:
          release: ${{ github.sha }}
          ignore_missing: true
          ignore_empty: true

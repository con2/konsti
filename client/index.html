<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,shrink-to-fit=no"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta
      http-equiv="cache-control"
      content="no-cache, no-store, must-revalidate"
    />
    <link rel="icon" href="/assets/favicon.png" />
    <title>Konsti</title>
  </head>
  <body>
    <!-- Browser translation replaces the text nodes React is holding, so the
         next commit that moves or removes one throws and the error boundary
         takes down the whole app. The app is translated in-app instead, through
         the language selector. This is the React root, and nothing renders
         outside it, so the whole tree inherits it. -->
    <div id="main" translate="no"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
